<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online color analyzer</title>
    <link rel="stylesheet" href="styles.css"></link>
    <link rel="icon" type="image/png" href="resources/favicon.png"></link>
</head>
<body>
    <color-picker></color-picker>
    <template id="color_picker_template">
        <div>Zoom in/out on the picture using the mouse wheel. Pan left/right/up/down by dragging the image with the left mouse button held down.</div>
        <canvas></canvas>
        <div>
            <label>Select scanned image: </label>
            <input id="picker_file" type="file" accept="image/*"></input>
        </div>
        <div>
            <label for="picker_range_min">Set orange box width</label>
            <input id="picker_range_min" type="range" range="min" min="10" max="100" value="25" step="1"></input>
        </div>
        <div>
            <label for="picker_range_max">Set orange box height</label>
            <input id="picker_range_max" type="range" range="max" min="10" max="100" value="25" step="1"></input>
        </div>
    </template>

    <color-organizer></color-organizer>
    <template id="color_organizer_template">
        <div id="color_table_wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="color_display">color</th>
                        <th class="color_name">name/notes</th>
                        <th class="color_data">&mu;<sub>L</sub> &#177; &sigma;<sub>L</sub></th>
                        <th class="color_data">&mu;<sub>C</sub> &#177; &sigma;<sub>C</sub></th>
                        <th class="color_data">&mu;<sub>h</sub> &#177; &sigma;<sub>h</sub></th>
                        <th class="icon"></th>
                        <th class="icon"></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="color_table_form">
            <label for="organizer_addcolor">Is your target area inside the orange rectangle? Then:</label>
            <input id="organizer_addcolor" type="button" value="add color"></input>
        </div>
    </template>
    <template id="color_organizer_row_template" color_id="">
        <tr>
            <td class="color_display"></td>
            <td class="color_name" contenteditable="true"></td>
            <td class="color_data data_L"></td>
            <td class="color_data data_a"></td>
            <td class="color_data data_b"></td>
            <td class="icon"><img class="icon toggle_visibility" height="20" src="./resources/visibility.png" /></td>
            <td class="icon"><img class="icon delete" height="20" src="./resources/delete.png" /></td>
        </tr>
    </template>

    <color-charts id="color_charts"></color-charts>
    <template id="color_charts_template">
        <div id="canvas_CH"></div>
        <div id="canvas_LC"></div>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
